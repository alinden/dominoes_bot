<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="body-clip">
      <path d="M 158 256 C 218 194, 326 194, 398 256 C 326 318, 218 318, 158 256 Z" />
    </clipPath>
  </defs>

  <!-- App Icon Rounded Background -->
  <rect width="512" height="512" rx="112" fill="#121514" />

  <g transform="translate(256 256) scale(1.5) translate(-247 -256)">
  <!-- Fins (behind body outline) -->
  <g fill="#121514" stroke="#FFD54F" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <!-- Dorsal Fin -->
    <path d="M 248 213 L 234 176 Q 272 182, 294 210 Z" />
    <!-- Pelvic Fin -->
    <path d="M 192 287 L 182 312 Q 208 310, 224 297 Z" />
    <!-- Anal Fin -->
    <path d="M 274 303 L 266 336 Q 298 326, 314 298 Z" />
  </g>

  <!-- Main Fish Body + Tail -->
  <path d="M 96 202 L 158 242 C 218 188, 326 188, 398 256 C 326 324, 218 324, 158 270 L 96 310 L 122 256 Z"
        fill="#121514" stroke="#FFD54F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- [5|5] Domino Tile Clipped Cleanly Inside Body -->
  <g clip-path="url(#body-clip)">
    <!-- Vertical Domino Borders & Center Divider -->
    <line x1="252" y1="190" x2="252" y2="322" stroke="#FFD54F" stroke-width="10" />
    <line x1="312" y1="190" x2="312" y2="322" stroke="#FFD54F" stroke-width="10" />
    <line x1="252" y1="256" x2="312" y2="256" stroke="#FFD54F" stroke-width="9" />

    <!-- Top Half [5] Pips -->
    <circle cx="268" cy="218" r="6.5" fill="#FFD54F" />
    <circle cx="296" cy="218" r="6.5" fill="#FFD54F" />
    <circle cx="282" cy="231" r="6.5" fill="#FFD54F" />
    <circle cx="268" cy="244" r="6.5" fill="#FFD54F" />
    <circle cx="296" cy="244" r="6.5" fill="#FFD54F" />

    <!-- Bottom Half [5] Pips -->
    <circle cx="268" cy="268" r="6.5" fill="#FFD54F" />
    <circle cx="296" cy="268" r="6.5" fill="#FFD54F" />
    <circle cx="282" cy="281" r="6.5" fill="#FFD54F" />
    <circle cx="268" cy="294" r="6.5" fill="#FFD54F" />
    <circle cx="296" cy="294" r="6.5" fill="#FFD54F" />
  </g>

  <!-- Re-stroke Body Outline Crisp Over Domino Clip -->
  <path d="M 96 202 L 158 242 C 218 188, 326 188, 398 256 C 326 324, 218 324, 158 270 L 96 310 L 122 256 Z"
        fill="none" stroke="#FFD54F" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Eye & Mouth -->
  <circle cx="348" cy="245" r="13" fill="#FFD54F" />
  <path d="M 364 274 L 395 257" stroke="#FFD54F" stroke-width="9" stroke-linecap="round" />
  </g>
</svg>
